# ============================================================
# Playbook: FAZ Audit Change Rule Monitor
# Mục đích : Pull code từ GitHub, tạo file secrets động,
#            cài dependencies và chạy monitor.py
# Target   : AWX EE Container (localhost)
# ============================================================

- name: FAZ Audit Change Rule - Run Monitor
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ── Đường dẫn làm việc trong container ──────────────────
    project_dir: "/runner/project"
    venv_dir:    "/runner/project/.venv"
    python_bin:  "/runner/project/.venv/bin/python"
    pip_bin:     "/runner/project/.venv/bin/pip"

    # ── Định nghĩa file cấu hình ────────────────────────────
    secrets_file:  "{{ project_dir }}/secrets.json"
    settings_file: "{{ project_dir }}/settings.json"

  tasks:

    # ── 1. Kiểm tra Python tồn tại ──────────────────────────
    - name: Check Python3 available
      ansible.builtin.command: python3 --version
      register: py_check
      changed_when: false

    - name: Show Python version
      ansible.builtin.debug:
        msg: "{{ py_check.stdout }}"

    # ── 2. Tạo virtualenv nếu chưa có ───────────────────────
    - name: Create virtualenv
      ansible.builtin.command:
        cmd: python3 -m venv {{ venv_dir }}
        creates: "{{ venv_dir }}/bin/activate"

    # ── 3. Cài dependencies từ requirements.txt ─────────────
    - name: Install Python dependencies
      ansible.builtin.command:
        cmd: "{{ pip_bin }} install -r {{ project_dir }}/requirements.txt --quiet"
      register: pip_result
      changed_when: "'Successfully installed' in pip_result.stdout"

    # ── 4. Tự động sinh file secrets.json từ AWX Variables ──
    - name: Generate secrets.json from AWX Variables
      ansible.builtin.copy:
        content: "{{ secret_data | to_nice_json }}"
        dest: "{{ secrets_file }}"
        mode: '0600'

    # ── 5. Chạy monitor.py ───────────────────────────────────
    - name: Run monitor.py
      ansible.builtin.command:
        cmd: "{{ python_bin }} {{ project_dir }}/monitor.py"
        chdir: "{{ project_dir }}"
      register: monitor_result
      # Timeout 55 phút - AWX schedule mỗi 1 giờ để tránh overlap
      timeout: 3300
      environment:
        PYTHONUNBUFFERED: "1"
        PYTHONPATH: "{{ project_dir }}"
        TZ: "Asia/Ho_Chi_Minh"  # <--- THÊM DÒNG NÀY ĐỂ FIX MÚI GIỜ CONTAINER

    # ── 6. In output của monitor.py ─────────────────────────
    - name: Show monitor output
      ansible.builtin.debug:
        msg: "{{ monitor_result.stdout_lines }}"
      when: monitor_result.stdout_lines | length > 0

    - name: Show monitor stderr (nếu có)
      ansible.builtin.debug:
        msg: "{{ monitor_result.stderr_lines }}"
      when: monitor_result.stderr_lines | length > 0